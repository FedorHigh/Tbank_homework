server:
  port: 8080
  error:
    include-stacktrace: always

spring:
  application:
    name: FDS-Spring
  datasource:
    url: jdbc:postgresql://localhost:5432/currency_tracker
    username: user
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    properties:
      hibernate:
        format_sql: true
      hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    #show-sql: true
  liquibase:
    change-log: classpath:changelog/db.changelog-master.sql
    enabled: true
